name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:      # lets CI be run on demand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check bot tests
      - name: Test
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t discord-music-bot:ci .
      - name: Run the test suite inside the image
        run: |
          docker run --rm --entrypoint sh discord-music-bot:ci -c \
            "pip install --quiet --no-cache-dir pytest pytest-asyncio && python -m pytest"
