services:
  discord-bot:
    build: .
    image: discord-music-bot:2
    container_name: discord-music-bot
    restart: unless-stopped
    network_mode: "host"          # voice UDP + simplest NAT story
    env_file:
      - .env
    environment:
      - DOCKER_CONTAINER=true
      - YTDLP_AUTO_UPDATE=true
    volumes:
      - ./logs:/app/logs
      - bot-downloads:/app/downloads   # temp media + guild settings (persisted)
    deploy:
      resources:
        limits:
          memory: 768M      # two concurrent x265 encodes need headroom
    stop_grace_period: 20s

volumes:
  bot-downloads:
